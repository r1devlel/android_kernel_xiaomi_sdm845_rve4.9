name: Kernel Build - BPF Port

on:
  push:
    branches:
      - bpf-port-stage1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex cpio \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            clang-18 lld-18 llvm-18 \
            libssl-dev libelf-dev libncurses-dev \
            dwarves pahole

      - name: Show toolchain
        run: |
          clang-18 --version
          aarch64-linux-gnu-gcc --version
          make --version

      - name: Prepare output
        run: |
          rm -rf out
          mkdir -p out

      - name: Generate defconfig
        run: |
          make O=out ARCH=arm64 sdm845-perf_defconfig

      - name: Build kernel
        run: |
          make -j"$(nproc)" O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang-18 \
            LD=ld.lld-18 \
            AR=llvm-ar-18 \
            NM=llvm-nm-18 \
            OBJCOPY=llvm-objcopy-18 \
            OBJDUMP=llvm-objdump-18 \
            STRIP=llvm-strip-18 \
            LLVM_IAS=0 \
            V=1

      - name: Diagnose unresolved kernel symbols
        if: always()
        run: |
          echo "=== CONFIG_TASKS_RCU in out/.config ==="
          grep -nE '^(CONFIG_TASKS_RCU=|# CONFIG_TASKS_RCU is not set)' out/.config || true
          echo "=== CONFIG_TASKS_RCU in generated auto.conf ==="
          grep -nE 'CONFIG_TASKS_RCU' out/include/config/auto.conf || true
          echo "=== RCU object symbol table ==="
          if test -f out/kernel/rcu/update.o; then
            llvm-nm-18 out/kernel/rcu/update.o | grep -E 'call_rcu_tasks|rcu_tasks' || true
          else
            echo "out/kernel/rcu/update.o is missing"
          fi
          echo "=== BPF trampoline unresolved references ==="
          if test -f out/kernel/bpf/trampoline.o; then
            llvm-nm-18 out/kernel/bpf/trampoline.o | grep -E 'call_rcu_tasks|bpf_dispatcher_change_prog' || true
          else
            echo "out/kernel/bpf/trampoline.o is missing"
          fi
          echo "=== Relevant built objects ==="
          for f in out/kernel/bpf/dispatcher.o out/net/core/xdp.o out/net/core/filter.o out/net/ipv4/bpf_tcp_ca.o out/net/bpf/test_run.o; do
            if test -f "$f"; then echo "PRESENT $f"; else echo "MISSING $f"; fi
          done

      - name: Check output
        run: |
          test -s out/arch/arm64/boot/Image
          ls -lh out/arch/arm64/boot/Image

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bpf-port-kernel
          path: |
            out/arch/arm64/boot/Image
            out/.config
          retention-days: 7
